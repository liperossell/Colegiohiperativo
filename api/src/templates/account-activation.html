<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Ative sua conta</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6;">
    <h1 style="color: #2563eb;">Bem-vindo ao Colégio Hiperativo</h1>
    <p>Olá, <strong>{{fullName}}</strong>.</p>
    <p>Sua conta foi criada com sucesso. Para ativá-la, clique no botão abaixo:</p>
    <p>
      <a
        href="{{activationLink}}"
        style="display: inline-block; background: #2563eb; color: #ffffff; padding: 12px 20px; text-decoration: none; border-radius: 6px;"
      >
        Ativar minha conta
      </a>
    </p>
    <p>Se o botão não funcionar, copie e cole este link no navegador:</p>
    <p style="word-break: break-all;">{{activationLink}}</p>
    <p style="font-size: 12px; color: #6b7280;">Este link expira em 24 horas.</p>
  </body>
</html>
